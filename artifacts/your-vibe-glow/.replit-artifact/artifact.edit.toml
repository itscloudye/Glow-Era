kind = "web"
previewPath = "/"
title = "Glow Era"
version = "1.0.0"
id = "artifacts/your-vibe-glow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18742

[services.development]
run = "pnpm --filter @workspace/your-vibe-glow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/your-vibe-glow", "run", "build" ]
publicDir = "artifacts/your-vibe-glow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18742"
BASE_PATH = "/"
