name: Deploy Your Vibe Glow to GitHub Pages

# In repository Settings → Pages, set the publishing source to GitHub Actions.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set Vite base path
        id: base
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repository/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build website
        run: |
          pnpm --filter @workspace/your-vibe-glow run build
          site_dir="artifacts/your-vibe-glow/dist/public"
          cp "$site_dir/index.html" "$site_dir/404.html"
          touch "$site_dir/.nojekyll"
        env:
          PORT: "18742"
          BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Verify production site files
        shell: bash
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}
        run: |
          site_dir="artifacts/your-vibe-glow/dist/public"
          test -s "$site_dir/index.html"
          test -s "$site_dir/404.html"
          test -s "$site_dir/favicon.svg"
          test -d "$site_dir/assets"
          find "$site_dir/assets" -type f -name '*.js' -print -quit | grep -q .
          find "$site_dir/assets" -type f -name '*.css' -print -quit | grep -q .
          grep -Fq '<div id="root"></div>' "$site_dir/index.html"
          grep -Fq "${BASE_PATH}assets/" "$site_dir/index.html"

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/your-vibe-glow/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
